<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROBPY — Python Submit</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="m-0 bg-gray-100"><div id="sync" class="fixed top-2 right-2 z-50 bg-white/95 shadow rounded-full px-3 py-1 text-xs text-gray-600">☁️ Connexion…</div><iframe id="robpy" src="tuto-core.html" class="w-full border-0" style="height:100vh"></iframe><script>
const URL='https://hxfdlujpedxuumqfewvn.supabase.co', KEY='sb_publishable_RMv9HFpnXdId5VxUVy_sDg_Kq57S_lF';
const sb=supabase.createClient(URL,KEY), frame=document.getElementById('robpy'), status=document.getElementById('sync');
const name=localStorage.getItem('ps_name')||'', classe=localStorage.getItem('ps_class')||'';let user=null,last='';
const HINTS=[['Pour afficher un texte en Python, utilise la fonction print().','Le message doit être placé entre guillemets à l’intérieur de print().'],['Commence par créer deux variables nommées R et I.','Affecte 470 à R et 0.02 à I, puis utilise print() une fois pour chacune.'],['La tension se calcule ici en multipliant la résistance par le courant.','Stocke le produit de R et I dans la variable U, puis affiche U.'],['Une f-string permet d’insérer la valeur d’une variable directement dans un texte.','Place la variable U entre accolades { } à l’endroit où sa valeur doit apparaître.'],['Il faut tester si U est supérieur à 5 avec une condition.','Utilise if pour le cas U > 5 et else pour l’autre cas ; chaque branche doit afficher le bon message.'],['Trois zones nécessitent trois branches de décision.','Utilise if pour U < 4.5, elif pour la zone jusqu’à 5.5, puis else pour le reste.'],['Une boucle for peut faire varier un numéro de 1 à 5.','Utilise range(1, 6), puis insère le numéro courant dans le texte avec une f-string.'],['Une boucle while convient quand on répète une opération jusqu’à atteindre une limite.','Tant que U est au moins égal à 1, divise U par 2 et augmente un compteur de 1.'],['Une fonction reçoit R et I en paramètres et doit renvoyer leur produit.','Dans tension(R, I), utilise return pour renvoyer le calcul, puis appelle la fonction avec 470 et 0.02.'],['Calcule d’abord U puis P, avant de construire le bilan.','Pour P, multiplie U par I et arrondis à 3 décimales ; utilise ensuite une f-string pour le bilan.']];
function fixNavigation(d){d.querySelectorAll('a[href="index.html"]').forEach(a=>a.href='eleve.html')}
function installProgressiveHints(){try{const d=frame.contentDocument;if(!d)return;fixNavigation(d);const old=d.getElementById('hint-btn'),box=d.getElementById('hint-box'),text=d.getElementById('hint-text');if(!old||!box||!text||old.dataset.progressive==='1')return;const btn=old.cloneNode(true);btn.dataset.progressive='1';old.replaceWith(btn);let step=0;btn.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();const m=(d.getElementById('level-badge')?.textContent||'1').match(/(\d+)/);const idx=m?Number(m[1])-1:0,pair=HINTS[idx]||HINTS[0];box.classList.remove('hidden');if(step===0){text.textContent=pair[0];btn.textContent='💡 Besoin d’un indice 2 ?';step=1}else{text.textContent=pair[1];btn.textContent='💡 Indice 2 affiché';btn.disabled=true}},true)}catch(e){console.error(e)}}
async function init(){try{const {data}=await sb.auth.getSession();user=data.session?.user||null;if(user){status.textContent='☁️ Récupération…';await pull()}else status.textContent='⚠️ Mode local';}catch(e){console.error(e);status.textContent='⚠️ Mode local'}finally{setInterval(sync,500)}}
async function pull(){const {data,error}=await sb.from('student_progress').select('robpy_progress').eq('user_id',user.id).maybeSingle();if(error){console.error(error);status.textContent='⚠️ Lecture cloud impossible';return}const cloud=Math.min(Number(data?.robpy_progress)||0,10);let local=[];try{local=JSON.parse(localStorage.getItem(`robpy_${name}`)||'[]')}catch{}const n=Math.max(cloud,local.length);const restored=Array.from({length:n},(_,i)=>i);localStorage.setItem(`robpy_${name}`,JSON.stringify(restored));localStorage.setItem(`robpy_level_${name}`,Math.min(n,9));last=JSON.stringify(restored);status.textContent=`☁️ Progression récupérée : ${n}/10`;try{const d=frame.contentDocument;if(d&&name){const inp=d.getElementById('login-name');if(inp){inp.value=name;d.getElementById('login-btn')?.click()}}}catch(e){}}
async function sync(){if(!user||!name||!classe)return;const raw=localStorage.getItem(`robpy_${name}`)||'[]';if(raw===last)return;let levels=[];try{levels=JSON.parse(raw)}catch{return}const n=Math.min(levels.length,10);const {error}=await sb.from('student_progress').update({robpy_progress:n}).eq('user_id',user.id);if(error){console.error(error);status.textContent='⚠️ Sauvegarde locale';return}last=raw;status.textContent=`☁️ Sauvegardé : ${n}/10`}
frame.addEventListener('load',()=>{try{const d=frame.contentDocument;fixNavigation(d);if(name){const inp=d.getElementById('login-name');if(inp){inp.value=name;setTimeout(()=>d.getElementById('login-btn')?.click(),150)}}setTimeout(installProgressiveHints,300)}catch(e){console.error(e)}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')sync()});init();
</script></body></html>
