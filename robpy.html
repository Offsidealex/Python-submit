<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROBPY — Python Submit</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="m-0 bg-gray-100"><div id="sync" class="fixed top-2 right-2 z-50 bg-white/95 shadow rounded-full px-3 py-1 text-xs text-gray-600">☁️ Connexion…</div><iframe id="robpy" src="tuto.html" class="w-full border-0" style="height:100vh"></iframe><script>
const URL='https://hxfdlujpedxuumqfewvn.supabase.co', KEY='sb_publishable_RMv9HFpnXdId5VxUVy_sDg_Kq57S_lF';
const sb=supabase.createClient(URL,KEY), frame=document.getElementById('robpy'), status=document.getElementById('sync');
const name=localStorage.getItem('ps_name')||'', classe=localStorage.getItem('ps_class')||'';let user=null,last='';
async function init(){const {data}=await sb.auth.getSession();user=data.session?.user||null;if(!user){status.textContent='⚠️ Reviens par la plateforme pour te connecter';return}status.textContent='☁️ Synchronisation active';await pull();setInterval(sync,1000)}
async function pull(){const {data,error}=await sb.from('student_progress').select('robpy_progress').eq('user_id',user.id).maybeSingle();if(error)return;const cloud=Number(data?.robpy_progress)||0;let local=[];try{local=JSON.parse(localStorage.getItem(`robpy_${name}`)||'[]')}catch{}const n=Math.max(cloud,local.length);localStorage.setItem(`robpy_${name}`,JSON.stringify(Array.from({length:Math.min(n,10)},(_,i)=>i)));last=localStorage.getItem(`robpy_${name}`)||'[]'}
async function sync(){if(!user||!name||!classe)return;const raw=localStorage.getItem(`robpy_${name}`)||'[]';if(raw===last)return;last=raw;let levels=[];try{levels=JSON.parse(raw)}catch{}status.textContent='☁️ Sauvegarde…';const {error}=await sb.from('student_progress').update({robpy_progress:Math.min(levels.length,10)}).eq('user_id',user.id);status.textContent=error?'⚠️ Sauvegarde locale':'☁️ Sauvegardé'}
frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(name){const inp=d.getElementById('login-name');if(inp){inp.value=name;setTimeout(()=>d.getElementById('login-btn')?.click(),150)}}}catch(e){console.error(e)}});window.addEventListener('beforeunload',sync);init();
</script></body></html>
