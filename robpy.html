<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROBPY — Python Submit</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="m-0 bg-gray-100"><div id="sync" class="fixed top-2 right-2 z-50 bg-white/95 shadow rounded-full px-3 py-1 text-xs text-gray-600">☁️ Connexion…</div><iframe id="robpy" src="tuto-core.html" class="w-full border-0" style="height:100vh"></iframe><script>
const URL='https://hxfdlujpedxuumqfewvn.supabase.co',KEY='sb_publishable_RMv9HFpnXdId5VxUVy_sDg_Kq57S_lF';const sb=supabase.createClient(URL,KEY),frame=document.getElementById('robpy'),status=document.getElementById('sync');const name=localStorage.getItem('ps_name')||'',classe=localStorage.getItem('ps_class')||'';let authUser=null,last='';
function patch(d){if(!d)return;d.querySelectorAll('a[href="index.html"]').forEach(a=>a.href='eleve.html');if(name){const inp=d.getElementById('login-name'),btn=d.getElementById('login-btn'),overlay=d.getElementById('login-overlay');if(inp)inp.value=name;const start=()=>{if(btn){btn.click();setTimeout(()=>{if(overlay&&overlay.style.display!=='none')btn.click()},300)}};setTimeout(start,350)}}
async function pull(){if(!authUser)return;const {data,error}=await sb.from('student_progress').select('robpy_progress').eq('user_id',authUser.id).maybeSingle();if(error){console.error(error);status.textContent='⚠️ Lecture cloud impossible';return}let local=[];try{local=JSON.parse(localStorage.getItem(`robpy_${name}`)||'[]')}catch{}const n=Math.min(Math.max(Number(data?.robpy_progress)||0,local.length),10),levels=Array.from({length:n},(_,i)=>i);localStorage.setItem(`robpy_${name}`,JSON.stringify(levels));localStorage.setItem(`robpy_level_${name}`,Math.min(n,9));last=JSON.stringify(levels);status.textContent=`☁️ Progression récupérée : ${n}/10`;patch(frame.contentDocument)}
async function sync(){if(!authUser||!name)return;const raw=localStorage.getItem(`robpy_${name}`)||'[]';if(raw===last)return;let a=[];try{a=JSON.parse(raw)}catch{return}const n=Math.min(a.length,10);const {error}=await sb.from('student_progress').update({robpy_progress:n}).eq('user_id',authUser.id);if(error){console.error(error);status.textContent='⚠️ Sauvegarde locale';return}last=raw;status.textContent=`☁️ Sauvegardé : ${n}/10`}
frame.addEventListener('load',()=>patch(frame.contentDocument));(async()=>{if(!name||!classe){location.replace('eleve.html');return}try{const {data}=await sb.auth.getSession();authUser=data.session?.user||null;if(!authUser){status.textContent='⚠️ Session expirée';setTimeout(()=>location.replace('eleve.html'),700);return}await pull();setInterval(sync,500)}catch(e){console.error(e);status.textContent='⚠️ Mode local';patch(frame.contentDocument)}})();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')sync()});window.addEventListener('pagehide',sync);
</script></body></html>
